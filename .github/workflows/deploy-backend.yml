# Deploy backend to Google Cloud Run on push to main
# Add GitHub secret: GCP_SA_KEY = JSON key of service account with Cloud Build + Cloud Run permissions

name: Deploy Backend (Cloud Run)

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'cloudbuild.yaml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Auth to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: gcloud builds submit --config=cloudbuild.yaml .
        working-directory: .
